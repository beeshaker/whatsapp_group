services:
  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
    networks:
      client-net:
        # Stable name for openwa's webhook (see /api/webhook-url in main.py);
        # the container IP changes on every recreate.
        aliases:
          - backend.internal

  openwa:
    build:
      context: ./openwa
    restart: always
    ports:
      - "127.0.0.1:${OPENWA_PORT}:2785"
    volumes:
      - openwa_data:/app/data
    environment:
      # WhatsApp alert when messages can't reach the backend (comma-separated
      # numbers with country code, digits only). Empty: failures are only logged.
      WEBHOOK_ALERT_PHONES: ${WEBHOOK_ALERT_PHONES:-}
      WEBHOOK_ALERT_LABEL: ${CLIENT_SUBDOMAIN:-}
    networks:
      - client-net
    depends_on:
      - backend

networks:
  client-net:
    driver: bridge

volumes:
  openwa_data:
  media_data:
